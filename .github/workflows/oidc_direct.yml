name: oidc-direct
on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:

permissions:
  id-token: write   # cho phép job xin OIDC token
  contents: read

jobs:
  aws:
    runs-on: ubuntu-latest
    steps:
      - name: Xem claims trong OIDC token (để học)
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | python3 -c \
            "import sys,base64,json;s=sys.stdin.read().strip();s+='='*(-len(s)%4);print(json.dumps(json.loads(base64.urlsafe_b64decode(s)),indent=2))"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}  
          role-session-name: gha-${{ github.run_id }}
          aws-region: ap-southeast-1

      - run: aws sts get-caller-identity
      - run: aws s3 ls